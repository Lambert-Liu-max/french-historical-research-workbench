[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "french-history-workbench"
version = "0.1.0"
description = "Evidence-first discovery and analysis workbench for French historical archives"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
fhrw = "french_history_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

